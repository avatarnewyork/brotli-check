name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    name: POSIX shell on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Check syntax and run regression suite
        run: |
          sh -n check-brotli.sh
          sh -n test_shell.sh
          sh -n scripts/package-release.sh
          sh test_shell.sh
      - name: Build and verify release package
        run: |
          sh scripts/package-release.sh 0.1.0
          unzip -t dist/brotli-check-v0.1.0.zip
          git diff --exit-code -- SHA256SUMS

  busybox:
    name: Alpine BusyBox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Run with BusyBox sh and awk
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,exec,size=16m \
            -v "$PWD:/kit:ro" --entrypoint /bin/sh alpine:3.23 /kit/test_shell.sh
